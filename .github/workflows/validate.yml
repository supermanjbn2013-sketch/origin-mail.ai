name: Validate deployment configuration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  compose-config:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate Compose configuration
        run: |
          cp .env.example .env
          sed -i 's/CHANGE_THIS_TO_A_LONG_RANDOM_PASSWORD/ci-only-placeholder-password/' .env
          sed -i 's#mail.example.com#mail.example.com#' .env
          docker compose config --quiet
