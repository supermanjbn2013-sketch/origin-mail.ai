services:
  mailpit:
    image: axllent/mailpit:v1.27.4
    container_name: origin-mail-ai
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGES: ${MP_MAX_MESSAGES:-5000}
      MP_UI_AUTH: ${MP_UI_AUTH:?Set MP_UI_AUTH in .env before starting}
      TZ: ${TZ:-Asia/Manila}
    volumes:
      - ./data:/data
    ports:
      # Keep the dashboard and SMTP listener private on the host.
      # Put a HTTPS reverse proxy in front of port 8025 for remote access.
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"
