services:
  mailpit:
    image: axllent/mailpit:v1.27.4
    container_name: origin-mail-ai
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGES: ${MP_MAX_MESSAGES:-5000}
      MP_UI_AUTH: ${MP_UI_AUTH:?Set MP_UI_AUTH in .env before starting}
      TZ: ${TZ:-Asia/Manila}
    volumes:
      - ./data:/data
    expose:
      - "8025"
    ports:
      # SMTP is available only on the host for local QA applications.
      - "127.0.0.1:1025:1025"

  caddy:
    image: caddy:2
    container_name: origin-mail-ai-proxy
    restart: unless-stopped
    depends_on:
      - mailpit
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env before starting}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
